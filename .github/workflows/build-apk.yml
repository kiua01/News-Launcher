name: Build News Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: write   # only used to attach the APK to a GitHub Release when you push a v* tag

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- First run only: rebuild the project from the uploaded news-launcher.zip.part* files ----
      # (GitHub's web upload allows max 100 files / 25 MB each, so the project is uploaded as 6 parts.)
      # Once the project is committed this step does nothing; you can delete it afterwards.
      - name: Bootstrap - unpack project (first run only)
        run: |
          set -e
          if [ ! -f news-launcher.zip.part00 ]; then
            echo "No part files found - project is already unpacked."
            exit 0
          fi
          parts=$(ls news-launcher.zip.part* | wc -l)
          if [ "$parts" -ne 6 ]; then
            echo "::error::Found $parts part files but expected 6. Upload news-launcher.zip.part00 to part05 to the repository root."
            exit 1
          fi
          cat news-launcher.zip.part* > "$RUNNER_TEMP/payload.zip"
          mkdir "$RUNNER_TEMP/payload"
          unzip -q "$RUNNER_TEMP/payload.zip" -d "$RUNNER_TEMP/payload"
          cp -a "$RUNNER_TEMP/payload/." .
          rm -f news-launcher.zip.part*
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Add News Launcher source"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724'

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Dummy file first (Firebase features stay off); replaced if you add your own secret.
          cat > app_pojavlauncher/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "news-launcher-dummy",
              "storage_bucket": "news-launcher-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.newslauncher.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly00000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app_pojavlauncher/google-services.json
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret."
          fi

      - name: Prepare release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set - the APK will be signed with the debug key (OK for testing, not for publishing updates)."
          fi

      - name: Build release APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || 'DUMMY' }}
          NEWS_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          NEWS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEWS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEWS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace --no-daemon

      - name: List built APKs
        run: |
          find app_pojavlauncher/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: News-Launcher-Release
          path: app_pojavlauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app_pojavlauncher/build/outputs/apk/release/*.apk
